<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TrustShield</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1d2b64, #f8cdda);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      animation: fadeIn 1.2s ease-in;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .container { background: #fff; padding: 36px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); max-width: 420px; width: 100%; text-align: center; }
    .logo { width: 185px; height: auto; margin: 0 auto 12px; }
    h1 { font-size: 26px; color: #1d2b64; margin-bottom: 18px; }
    input[type="email"], input[type="password"], input[type="text"] { width: 100%; padding: 12px 14px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    input:focus { border-color: #1d2b64; outline: none; box-shadow: 0 0 0 3px rgba(29,43,100,0.12); }
    button { width: 100%; padding: 12px; background: #1d2b64; color: #fff; font-size: 16px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; margin-top: 12px; }
    button:hover { background: #111a3d; }
    #status { margin-top: 12px; font-size: 14px; color: #d8000c; min-height: 18px; }
    p { margin-top: 12px; font-size: 14px; }
    a { color: #1d2b64; font-weight: 600; }
    #reset-section, #totp-section, #totp-setup { display: none; margin-top: 14px; }
    #qrImage { margin-top: 10px; }
    footer { margin-top: 18px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <img src="../TrustShield.png" alt="TrustShield Logo" class="logo">
    <h1>Login</h1>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <label><input type="checkbox" id="rememberDevice"> Remember this device</label><br>
    <button id="loginBtn">Login</button>

    <p><a href="#" onclick="toggleReset(); return false;">Forgot password?</a></p>
    <p>Don't have an account? <a href="index.html">Register here</a></p>

    <div id="reset-section">
      <h3>Reset Password</h3>
      <input type="email" id="reset-email" placeholder="Enter your email"><br>
      <button id="resetBtn">Send Reset Email</button>
    </div>

    <div id="totp-section">
      <h3>Multi-Factor Authentication</h3>
      <div id="totp-setup">
        <p>Scan this QR code with Google Authenticator:</p>
        <img id="qrImage" src="" width="200" alt="QR code"><br>
        <p>Then enter the 6-digit code below:</p>
      </div>
      <input type="text" id="totpCode" placeholder="Enter 6-digit code"><br>
      <button id="verifyTotpBtn">Verify & Login</button>
    </div>

    <p id="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, updateDoc, addDoc, collection, serverTimestamp, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBtrbsrvFNkJ_QL94nz5aGlrbGexoab7lY",
      authDomain: "firm-source-440003-a8.firebaseapp.com",
      projectId: "firm-source-440003-a8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let tempUser = null;
    let totpSecret = null;
    let qrDisplayed = false;

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("resetBtn").addEventListener("click", resetPassword);
    document.getElementById("verifyTotpBtn").addEventListener("click", verifyTotp);
    document.getElementById("totpCode").addEventListener("keyup", async (e) => { if (e.key === "Enter") await verifyTotp(); });

    async function getUserIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        if (!res.ok) return 'unknown';
        const data = await res.json();
        return data.ip || 'unknown';
      } catch (e) {
        return 'unknown';
      }
    }

    function generateSecret() {
      const charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      let secret = '';
      for (let i = 0; i < 32; i++) secret += charset.charAt(Math.floor(Math.random() * charset.length));
      return secret;
    }

    function getOtpAuthUrl(userEmail, secret) {
      const label = `TrustShield:${userEmail}`;
      return `otpauth://totp/${encodeURIComponent(label)}?secret=${secret}&issuer=TrustShield`;
    }

    async function generateTOTP(secret) {
      const key = base32ToBytes(secret);
      const epoch = Math.floor(Date.now() / 1000);
      let time = Math.floor(epoch / 30);
      const msg = new Uint8Array(8);
      for (let i = 7; i >= 0; --i) { msg[i] = time & 0xff; time >>= 8; }
      const cryptoKey = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
      const hmacBuf = await crypto.subtle.sign('HMAC', cryptoKey, msg);
      const hmac = new Uint8Array(hmacBuf);
      const offset = hmac[19] & 0xf;
      const binCode = (new DataView(hmacBuf).getUint32(offset) & 0x7fffffff) % 1000000;
      return binCode.toString().padStart(6, '0');
    }

    function base32ToBytes(base32) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      let bits = '';
      for (const char of base32) {
        const idx = alphabet.indexOf(char.toUpperCase());
        if (idx === -1) continue;
        bits += idx.toString(2).padStart(5, '0');
      }
      const bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.substr(i, 8), 2));
      return new Uint8Array(bytes);
    }

    // MAIN LOGIN
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const remember = document.getElementById("rememberDevice").checked;

      if (!email || !password) return setStatus('❌ Please enter email and password.');

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;

        if (!user.emailVerified) { setStatus('⚠️ Please verify your email before login.'); return; }

        const docRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(docRef);
        if (!userSnap.exists()) { setStatus('❌ User role not found.'); await logAccess(email, 'failed'); return; }

        const userData = userSnap.data() || {};
        const currentIP = await getUserIP();
        const knownIPs = userData.knownIPs || [];

        if (knownIPs.includes(currentIP) || localStorage.getItem(`remember_${user.uid}`) === "yes") {
          await logAccess(user.email, 'success');
          return redirectToDashboard(userData.role);
        }

        if (!userData.totpSecret) {
          totpSecret = generateSecret();
          const otpauth = getOtpAuthUrl(user.email, totpSecret);
          document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(otpauth)}&size=200x200`;
          document.getElementById("totp-setup").style.display = 'block';
          document.getElementById("totp-section").style.display = 'block';
          tempUser = user;
          qrDisplayed = true;
          setTimeout(() => { if (qrDisplayed) document.getElementById("totp-setup").style.display = 'none'; }, 15000);
          await logAccess(user.email, 'waiting');
          setStatus("📲 Scan the QR code using Google Authenticator, enter the 6-digit code and press Enter or click Verify.");
          return;
        }

        // user has existing TOTP
        totpSecret = userData.totpSecret;
        tempUser = user;
        document.getElementById("totp-section").style.display = 'block';
        setStatus("✅ Enter 6-digit code from your Authenticator app.");

      } catch (err) {
        console.error('Login error:', err);
        // attempt to record failed login (best-effort)
        try { await logAccess(email, 'failed'); } catch (e) { console.error('logAccess failed:', e); }
        try { await logFailedLogin(email); } catch (e) { console.error('logFailedLogin failed:', e); }
        setStatus("❌ " + (err && err.message ? err.message : err));
      }
    }

    // Log to backend and Firestore (best-effort)
    async function logAccess(email, result) {
      try {
        const res = await fetch('https://fyp-1-xbt3.onrender.com/logs', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, result })
        });

        let ip = 'unknown';
        if (res && res.ok) {
          const data = await res.json();
          ip = data.ipUsed || data.ip || 'unknown';
        } else {
          console.warn('Backend /logs returned non-ok:', res && res.status);
        }

        // Try writing to Firestore (may be blocked by security rules when unauthenticated)
        try {
          await addDoc(collection(db, 'logs'), { email, ip, result, timestamp: serverTimestamp() });
          console.log('✅ Logged to Firestore (best-effort):', ip);
        } catch (e) {
          console.warn('⚠️ Firestore write failed (likely rules):', e);
        }
      } catch (err) {
        console.error('❌ Log failed:', err);
      }
    }

    // POST to /failed-login on your server (best-effort)
    async function logFailedLogin(email) {
      try {
        const response = await fetch("https://trustshield.onrender.com/failed-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        if (!response.ok) console.error('Failed to log failed login:', response.status, response.statusText);
        else console.log('Failed login logged successfully (server).');
      } catch (error) {
        console.error('Error logging failed login:', error);
      }
    }

    async function verifyTotp() {
      const code = document.getElementById("totpCode").value.trim();
      if (!code || !totpSecret || !tempUser) return setStatus("❌ Missing code or session.");

      const expected = await generateTOTP(totpSecret);
      if (code !== expected) return setStatus("❌ Invalid code. Try again.");

      const docRef = doc(db, "users", tempUser.uid);
      const userSnap = await getDoc(docRef);
      const userData = userSnap.exists() ? userSnap.data() : {};

      if (!userData.totpSecret) {
        try { await updateDoc(docRef, { totpSecret }); } catch (e) { console.warn('Failed to save totpSecret:', e); }
      }

      if (document.getElementById("rememberDevice").checked) {
        const ip = await getUserIP();
        localStorage.setItem(`remember_${tempUser.uid}`, "yes");
        try { await updateDoc(docRef, { knownIPs: arrayUnion(ip) }); } catch (e) { console.warn('Failed to update knownIPs:', e); }
      }

      await logAccess(tempUser.email, 'success');
      redirectToDashboard((userData && userData.role) || "user");
    }

    function redirectToDashboard(role) {
      setStatus("✅ Login successful. Redirecting...");
      window.location.href = role === "admin" ? "admin.html" : "user.html";
    }

    function resetPassword() {
      const email = document.getElementById("reset-email").value.trim();
      if (!email) return setStatus("❌ Please enter your email address.");
      sendPasswordResetEmail(auth, email)
        .then(() => setStatus("✅ Reset email sent. Check your inbox (or spam folder)."))
        .catch(err => setStatus("❌ " + err.message));
    }

    function toggleReset() {
      const resetSection = document.getElementById("reset-section");
      resetSection.style.display = resetSection.style.display === 'block' ? 'none' : 'block';
    }
    window.toggleReset = toggleReset;

    function setStatus(msg) { document.getElementById("status").innerText = msg; }
  </script>
</body>
</html>
