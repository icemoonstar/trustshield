<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - TrustShield</title>
  <link rel="icon" type="image/png" href="assets/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1d2b64, #f8cdda);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 1.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      animation: slideIn 0.8s ease-in-out;
      text-align: center;
    }

    @keyframes slideIn {
      from { transform: translateY(-40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo {
      width: 185px;
      height: auto;
      animation: logoPop 0.8s ease-in-out;
    }

    @keyframes logoPop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

      h1, h2 {
        color: #1d2b64;
        margin-bottom: 16px;
        padding-bottom: 4px;
      }


    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #1d2b64;
      outline: none;
      box-shadow: 0 0 0 3px rgba(29, 43, 100, 0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1d2b64;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: #111a3d;
      transform: translateY(-2px);
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #d8000c;
    }

    p {
      margin-top: 20px;
      font-size: 14px;
    }

    a {
      color: #1d2b64;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 22px;
      }

      button {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Edit Profile</h2>
    <label>Email (read-only)</label>
    <input type="email" id="email" readonly />

    <label>Name</label>
    <input type="text" id="name" placeholder="Your Name" />
    <br>
    <label>Phone</label>
    <input type="text" id="phone" placeholder="Your Phone Number" />

    <button onclick="updateProfile()">Save Changes</button>
    <div class="status" id="status"></div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const firebaseConfig = {
      apiKey: "AIzaSyBtrbsrvFNkJ_QL94nz5aGlrbGexoab7lY",
      authDomain: "firm-source-440003-a8.firebaseapp.com",
      projectId: "firm-source-440003-a8",
      storageBucket: "firm-source-440003-a8.appspot.com",
      messagingSenderId: "848973756858",
      appId: "1:848973756858:web:c0d17437ac2066346d8583",
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const emailInput = document.getElementById("email");
    const nameInput = document.getElementById("name");
    const phoneInput = document.getElementById("phone");
    const statusDiv = document.getElementById("status");

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      emailInput.value = user.email;

      try {
        const docRef = db.collection("users").doc(user.uid);
        const doc = await docRef.get();
        if (doc.exists) {
          const data = doc.data();
          nameInput.value = data.name || "";
          phoneInput.value = data.phone || "";
        } else {
          statusDiv.innerText = "⚠️ No user data found.";
        }
      } catch (err) {
        console.error(err);
        statusDiv.innerText = "❌ Failed to fetch user data.";
      }
    });

    window.updateProfile = async function () {
      const user = auth.currentUser;
      if (!user) return;

      const uid = user.uid;
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();

      try {
        await db.collection("users").doc(uid).update({ name, phone });
        statusDiv.innerText = "✅ Profile updated!";
        statusDiv.style.color = "green";

        const userDoc = await db.collection("users").doc(uid).get();
        const userData = userDoc.data();

        if (userData.role === "admin") {
          window.location.href = "admin.html";
        } else {
          window.location.href = "user.html";
        }
      } catch (err) {
        console.error(err);
        statusDiv.innerText = "❌ Failed to update profile.";
        statusDiv.style.color = "red";
      }
    };
  });
</script>


</body>
</html>
